[hosts]
# name | os (posix|cmd|wsl) | benutzer@host | pfad auf dem host | passwort (leer = ssh-schluessel) | git-url |
# Github Path is the repo, for the pull on the build targets@host
local       | posix   |                        |                               |          |     |


[targets]
declare -A CONF_CMD BUILD_CMD REQUIRE RUN_CMD PUBLISH_CMD INSTALL_CMD DOWNLOAD

CONF_CMD[pdfgen]='cmake -B builds/pdfgen -S . -G Ninja -DCMAKE_BUILD_TYPE=Release'
BUILD_CMD[pdfgen]='cmake --build builds/pdfgen -j ${JOBS}'
RUN_CMD[pdfgen]='./build/pdfgen --help'
# RUN_CMD[pdfgen]='./build/pdfgen --path /path/to/bewerbung'
# RUN_CMD[pdfgen]='./build/pdfgen dir1 dir2 dir3'
PUBLISH_CMD[pdfgen]='publish_release.sh builds/pdfgen'
DOWNLOAD[pdfgen]='builds/pdfgen/pdfgen'


[release]
# Git-Repository, in das publish_release.sh die Pakete und release.json pusht.
RELEASE_GIT_URL="https://github.com/vi0lin/releases.git"
# Kurzbeschreibung, erscheint als "notes" in release.json (optional).
RELEASE_NOTES=""


[packages]
# Approach To Multiplattform Compability
winget::adb = Google.PlatformTools
apt::adb    = android-tools-adb
winget::zip = 7zip.7zip
apt::zip    = zip


[exclude]
# Exclude all build paths
builds/
# But dont exclude the produced binary files (so buildfiles will not get synchronized reducing overhead)
!builds/*/pdfgen*
# Exclude external/
external/
# But dont exclude the submodule external/curl
# !external/curl/
